[project]
name = "syncro-robot-host"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "joblib>=1.6.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "opensmile>=2.6.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

# Poe tasks

[tool.poe.tasks]

# Whole suite and test layers
test = "python -m pytest -q tests"
test-unit = "python -m pytest -q tests/unit"
test-integration = "python -m pytest -q tests/integration"

# One component at a time
test-adapters = "python -m pytest -q tests/unit/adapters"
test-api = "python -m pytest -q tests/unit/api"
test-audio = "python -m pytest -q tests/unit/audio"
test-composition = "python -m pytest -q tests/unit/composition"
test-config = "python -m pytest -q tests/unit/config"
test-pipeline = "python -m pytest -q tests/unit/pipeline"
test-storage = "python -m pytest -q tests/unit/storage"
test-ml = "python -m pytest -q tests/unit/ml_affect"
test-scripts = "python -m pytest -q tests/unit/scripts"

# Coverage
test-coverage = "python -m pytest -q tests --cov --cov-report=term-missing --cov-report=html"
test-coverage-unit = "python -m pytest -q tests/unit --cov --cov-report=term-missing"
test-coverage-integration = "python -m pytest -q tests/integration --cov --cov-report=term-missing"

# Operational
serve = "python -m uvicorn api.app:app --host 0.0.0.0 --port 8765"

# Linting / formatting
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format --check ."

# General validation
[tool.poe.tasks.check]
sequence = ["lint", "format-check"]

# Security
[tool.poe.tasks.audit]
sequence = [
    { cmd = "uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt" },
    { cmd = "pip-audit -r requirements-audit.txt --disable-pip" },
]

# Ruff

[tool.ruff]
line-length = 100
exclude = ["techdocs/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP007", "UP031", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"scripts/test_f6_baseline.py" = ["E402"]

# Coverage

[tool.coverage.run]
branch = true
source = [
    "api",
    "adapters",
    "audio",
    "config",
    "composition",
    "ml",
    "pipeline",
    "storage",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
