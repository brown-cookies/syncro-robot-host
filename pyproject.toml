[project]
name = "syncro-robot-host"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "joblib>=1.6.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "opensmile>=2.6.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = ["poethepoet>=0.48.0", "pytest>=9.1.1"]

[tool.uv]
package = false

[tool.poe.tasks]
# Whole suite and groups
test-all = "python -m pytest -q"
test-unit = "python -m pytest -q tests/unit"
test-integration = "python -m pytest -q tests/integration"

# One component at a time
test-adapters = "python -m pytest -q tests/unit/adapters"
test-api = "python -m pytest -q tests/unit/api"
test-audio = "python -m pytest -q tests/unit/audio"
test-composition = "python -m pytest -q tests/unit/composition"
test-config = "python -m pytest -q tests/unit/config"
test-pipeline = "python -m pytest -q tests/unit/pipeline"
test-storage = "python -m pytest -q tests/unit/storage"
test-ml-affect = "python -m pytest -q tests/unit/ml_affect"
test-scripts = "python -m pytest -q tests/unit/scripts"

# Operational
serve = "python -m uvicorn api.app:app --host 0.0.0.0 --port 8765"
