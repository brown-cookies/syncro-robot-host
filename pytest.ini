[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    integration: cross-component integration tests
    ml: WP-104 machine-learning tests
    unit: single-component unit tests (everything under tests/unit)
    adapters: tests for adapters/ (affect, llm, stt, tts)
    api: tests for api/ (HTTP and WebSocket surfaces)
    audio: tests for audio/ (capture, playback, resample, wake word)
    composition: tests for composition/ (dependency wiring)
    config: tests for config/ (typed settings)
    pipeline: tests for pipeline/ (graph, nodes, policy, interaction)
    storage: tests for storage/ (SQLite schema, store, migrations)
    ml_affect: tests for ml/affect/ (features, training, tuning, evaluation)
    scripts: tests for scripts/ (operational runners)